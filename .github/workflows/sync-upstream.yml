name: Weekly upstream sync

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch:       # manual run from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Fast-forward develop from upstream
        run: |
          git remote add upstream https://github.com/codalab/codabench.git
          git fetch upstream develop
          git merge --ff-only upstream/develop || { echo "::error::develop has diverged from upstream (it must stay a pure mirror)"; exit 1; }
          git push origin develop

      - name: Merge develop into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout dev
          git merge develop -m "Merge develop (upstream) into dev" || { echo "::error::Merge conflict, resolve manually"; exit 1; }
          git push origin dev
